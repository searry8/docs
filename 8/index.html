<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Docs simples</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
    }

    /* Menu gauche */
    .menu {
      width: 200px;
      background: #f5f5f5;
      height: 100vh;
      padding: 15px;
      box-sizing: border-box;
      border-right: 1px solid #ddd;
    }

    .menu h3 {
      margin-top: 0;
    }

    .menu div {
      padding: 8px;
      cursor: pointer;
      border-radius: 5px;
    }

    .menu div:hover {
      background: #e0e0e0;
    }

    /* Contenu */
    .content {
      flex: 1;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
    }

    code {
      background: #eee;
      padding: 2px 5px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <!-- MENU -->
  <div class="menu">
    <h3>📚 Docs</h3>
    <div onclick="show('home')">Accueil</div>
    <div onclick="show('install')">Installation</div>
    <div onclick="show('use')">Utilisation</div>
  </div>

  <!-- CONTENU -->
  <div class="content" id="content">
    <h1>Bienvenue</h1>
    <p>Clique sur un article à gauche.</p>
  </div>

  <script>
    const pages = {
      home: `
        <h1>Accueil</h1>
        <p>Bienvenue dans ta documentation.</p>
      `,
      install: `
        <h1>Installation</h1>
        <p>Télécharge le projet puis lance :</p>
        <code>npm install</code>
      `,
      use: `
        <h1>Utilisation</h1>
        <p>Démarre avec :</p>
        <code>npm start</code>
      `
    };

    function show(page) {
      document.getElementById("content").innerHTML = pages[page];
    }
  </script>

</body>
</html>
