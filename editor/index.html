<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs — Documentation du projet</title>
<style>
  :root{
    --ink:#171a21;
    --paper:#faf8f3;
    --panel:#12141a;
    --panel-line:#242833;
    --accent:#e8a33d;
    --accent-soft:#f6dcae;
    --text-muted:#7b8290;
    --code-bg:#eee9dd;
    --code-border:#ddd5c2;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter","Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;
    min-height:100vh;
  }
  h1,h2,h3,.brand{
    font-family:"Space Grotesk","Inter",sans-serif;
    letter-spacing:-0.01em;
  }
  code, pre, .kbd{
    font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--panel);
    color:#e7e8ec;
    min-height:100vh;
    padding:22px 16px;
    position:sticky;
    top:0;
    align-self:flex-start;
    border-right:1px solid var(--panel-line);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:17px;
    font-weight:600;
    color:#fff;
    margin:0 4px 22px;
  }
  .brand .cursor{
    color:var(--accent);
    animation:blink 1.1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .search{
    width:100%;
    background:#1c1f28;
    border:1px solid var(--panel-line);
    color:#e7e8ec;
    padding:8px 10px;
    border-radius:var(--radius);
    font-size:13px;
    margin-bottom:18px;
    font-family:inherit;
  }
  .search::placeholder{ color:var(--text-muted); }
  .search:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .section-label{
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:.09em;
    color:var(--text-muted);
    margin:18px 8px 6px;
  }

  .nav-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    margin:1px 0;
    border-radius:var(--radius);
    cursor:pointer;
    font-size:14px;
    color:#c7c9d1;
    border:1px solid transparent;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item .tag{
    font-size:10px;
    color:#6c7280;
    font-family:"IBM Plex Mono",monospace;
  }
  .nav-item:hover{
    background:#1c1f28;
    color:#fff;
  }
  .nav-item.active{
    background:#1c1f28;
    color:#fff;
    border-color:var(--panel-line);
    box-shadow:inset 3px 0 0 var(--accent);
  }
  .nav-item[hidden]{ display:none; }

  /* ---------- CONTENT ---------- */
  .content-wrap{
    flex:1;
    display:flex;
    justify-content:center;
    padding:48px 32px 80px;
  }
  .content{
    width:100%;
    max-width:680px;
  }
  .breadcrumb{
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:10px;
    font-family:"IBM Plex Mono",monospace;
  }
  .breadcrumb .accent{ color:var(--accent); }
  h1{ font-size:32px; margin:0 0 4px; }
  .lede{
    color:var(--text-muted);
    font-size:16px;
    margin:0 0 28px;
  }
  .content p{
    font-size:15.5px;
    line-height:1.7;
    color:#333844;
  }
  .content h2{
    font-size:19px;
    margin:30px 0 10px;
    padding-top:6px;
  }

  pre{
    background:var(--code-bg);
    border:1px solid var(--code-border);
    border-radius:var(--radius);
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.6;
    overflow-x:auto;
    position:relative;
  }
  code.inline{
    background:var(--code-bg);
    border:1px solid var(--code-border);
    padding:2px 6px;
    border-radius:5px;
    font-size:0.9em;
  }
  .copy-btn{
    position:absolute;
    top:8px;
    right:8px;
    background:var(--panel);
    color:#e7e8ec;
    border:none;
    border-radius:6px;
    font-size:11px;
    padding:5px 9px;
    cursor:pointer;
    font-family:"Inter",sans-serif;
    opacity:.85;
  }
  .copy-btn:hover{ opacity:1; }

  .callout{
    display:flex;
    gap:10px;
    background:var(--accent-soft);
    border:1px solid #e3c184;
    border-radius:var(--radius);
    padding:12px 14px;
    font-size:14px;
    margin:20px 0;
  }

  .pager{
    display:flex;
    justify-content:space-between;
    margin-top:44px;
    padding-top:20px;
    border-top:1px solid #e6e1d4;
  }
  .pager a{
    text-decoration:none;
    color:var(--ink);
    font-size:13px;
    border:1px solid #e6e1d4;
    border-radius:var(--radius);
    padding:10px 14px;
    display:block;
    max-width:45%;
  }
  .pager a:hover{ border-color:var(--accent); }
  .pager .dir{ display:block; color:var(--text-muted); font-size:11px; margin-bottom:2px; }
  .pager .next{ margin-left:auto; text-align:right; }

  .menu-toggle{
    display:none;
  }

  @media (max-width: 760px){
    body{ flex-direction:column; }
    .sidebar{
      width:100%;
      min-height:auto;
      position:static;
      padding:14px 16px;
    }
    .menu-toggle{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#1c1f28;
      color:#fff;
      border:1px solid var(--panel-line);
      border-radius:var(--radius);
      padding:8px 10px;
      font-size:13px;
      cursor:pointer;
      margin-bottom:12px;
    }
    .nav-list{ display:none; }
    .nav-list.open{ display:block; }
    .content-wrap{ padding:32px 20px 60px; }
  }

  a:focus-visible, .nav-item:focus-visible, .search:focus-visible, .copy-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
</style>
</head>
<body>

  <!-- SIDEBAR -->
  <nav class="sidebar" aria-label="Navigation de la documentation">
    <div class="brand">docs<span class="cursor">_</span></div>

    <input class="search" id="search" type="text" placeholder="Rechercher…" aria-label="Rechercher dans la documentation">

    <div id="nav-list" class="nav-list open">
      <div class="section-label">Démarrer</div>
      <div class="nav-item" data-page="home" data-keywords="accueil bienvenue">
        <span>Accueil</span>
      </div>
      <div class="nav-item" data-page="install" data-keywords="installation npm setup">
        <span>Installation</span>
      </div>
      <div class="nav-item" data-page="use" data-keywords="utilisation démarrer start">
        <span>Utilisation</span>
      </div>

      <div class="section-label">Aller plus loin</div>
      <div class="nav-item" data-page="config" data-keywords="configuration options env">
        <span>Configuration</span>
      </div>
      <div class="nav-item" data-page="faq" data-keywords="faq questions problèmes erreurs">
        <span>FAQ</span>
      </div>
    </div>
  </nav>

  <!-- CONTENU -->
  <div class="content-wrap">
    <main class="content" id="content" tabindex="-1"></main>
  </div>

<script>
  const pages = {
    home: {
      crumb: "Démarrer / Accueil",
      title: "Bienvenue",
      lede: "Tout ce qu'il faut pour installer, configurer et utiliser le projet.",
      body: `
        <p>Cette documentation est volontairement courte : trois pages pour démarrer, deux de plus quand on va plus loin. Utilisez le menu à gauche, ou tapez dans la recherche pour filtrer les articles.</p>
        <div class="callout">💡 Nouveau ici ? Commencez par <strong>Installation</strong>, puis <strong>Utilisation</strong>.</div>
      `,
      next: "install"
    },
    install: {
      crumb: "Démarrer / Installation",
      title: "Installation",
      lede: "Deux commandes suffisent pour avoir un environnement prêt à l'emploi.",
      body: `
        <p>Téléchargez le projet, placez-vous dans le dossier, puis installez les dépendances :</p>
        <pre><button class="copy-btn" data-copy="npm install">Copier</button>npm install</pre>
        <p>Node.js 18 ou une version plus récente est requis. Vérifiez votre version avec <code class="inline">node -v</code> avant de continuer.</p>
      `,
      prev: "home",
      next: "use"
    },
    use: {
      crumb: "Démarrer / Utilisation",
      title: "Utilisation",
      lede: "Lancer le projet en local en une commande.",
      body: `
        <p>Une fois les dépendances installées, démarrez le serveur de développement :</p>
        <pre><button class="copy-btn" data-copy="npm start">Copier</button>npm start</pre>
        <p>Par défaut, l'application est accessible sur <code class="inline">http://localhost:3000</code>. Le port peut être changé dans la configuration.</p>
      `,
      prev: "install",
      next: "config"
    },
    config: {
      crumb: "Aller plus loin / Configuration",
      title: "Configuration",
      lede: "Adapter le comportement du projet à votre environnement.",
      body: `
        <p>La configuration se fait via un fichier <code class="inline">.env</code> à la racine du projet :</p>
        <pre><button class="copy-btn" data-copy="PORT=4000&#10;API_URL=https://api.example.com">Copier</button>PORT=4000
API_URL=https://api.example.com</pre>
        <p>Toute variable définie ici est rechargée automatiquement au prochain démarrage du serveur.</p>
      `,
      prev: "use",
      next: "faq"
    },
    faq: {
      crumb: "Aller plus loin / FAQ",
      title: "Questions fréquentes",
      lede: "Les problèmes les plus courants, et comment les résoudre.",
      body: `
        <h2>La commande npm install échoue</h2>
        <p>Vérifiez votre version de Node.js et supprimez le dossier <code class="inline">node_modules</code> avant de réessayer.</p>
        <h2>Le port 3000 est déjà utilisé</h2>
        <p>Changez la variable <code class="inline">PORT</code> dans votre fichier <code class="inline">.env</code>, voir la page Configuration.</p>
      `,
      prev: "config"
    }
  };

  const contentEl = document.getElementById("content");
  const navList = document.getElementById("nav-list");
  const navItems = [...document.querySelectorAll(".nav-item")];
  const searchEl = document.getElementById("search");

  function render(pageKey){
    const page = pages[pageKey];
    if(!page) return;

    navItems.forEach(item => {
      item.classList.toggle("active", item.dataset.page === pageKey);
    });

    const prevLink = page.prev
      ? `<a href="#" data-nav="${page.prev}"><span class="dir">← Précédent</span>${pages[page.prev].title}</a>`
      : `<span></span>`;
    const nextLink = page.next
      ? `<a href="#" data-nav="${page.next}" class="next"><span class="dir">Suivant →</span>${pages[page.next].title}</a>`
      : `<span></span>`;

    contentEl.innerHTML = `
      <div class="breadcrumb">${page.crumb.replace(/\/([^/]+)$/, '/ <span class="accent">$1</span>')}</div>
      <h1>${page.title}</h1>
      <p class="lede">${page.lede}</p>
      ${page.body}
      <div class="pager">${prevLink}${nextLink}</div>
    `;

    contentEl.focus();
    history.replaceState(null, "", "#" + pageKey);

    contentEl.querySelectorAll("[data-nav]").forEach(el => {
      el.addEventListener("click", e => {
        e.preventDefault();
        render(el.dataset.nav);
      });
    });

    contentEl.querySelectorAll(".copy-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        try{
          await navigator.clipboard.writeText(btn.dataset.copy.replace(/&#10;/g, "\n"));
          const old = btn.textContent;
          btn.textContent = "Copié ✓";
          setTimeout(() => btn.textContent = old, 1400);
        }catch(e){ /* clipboard indisponible, on ignore silencieusement */ }
      });
    });
  }

  navItems.forEach(item => {
    item.addEventListener("click", () => render(item.dataset.page));
  });

  searchEl.addEventListener("input", () => {
    const q = searchEl.value.trim().toLowerCase();
    navItems.forEach(item => {
      const text = (item.textContent + " " + item.dataset.keywords).toLowerCase();
      item.hidden = q.length > 0 && !text.includes(q);
    });
  });

  // page initiale : lit le hash de l'URL si présent, sinon "home"
  const initial = location.hash.replace("#", "");
  render(pages[initial] ? initial : "home");
</script>
</body>
</html>
